<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stop watch</title>
    <link rel="stylesheet" href="./stop watch.css">
</head>
<body>
    <div class="stopwatch">
        <h1 id="displayTime">00:00:00</h1>
        <div class="buttons">
            <img src="./th.jpeg" onclick="watchStop()">
            <img src="./th (1).jpeg" onclick="watchStart()">
            <img src="./download.jpeg" onclick="watchReset()">
        </div>
    </div>
    <script src="./stop watch.js"></script>
</body>
</html>
